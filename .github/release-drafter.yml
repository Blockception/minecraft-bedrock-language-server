name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"
        - "dependencies"
  - title: "📱 Client"
    when:
      labels:
        - "client"
  - title: "🖥️ Server"
    when:
      labels:
        - "server"
  - title: "🔬 integration tests"
    when:
      labels:
        - integration-tests
  - title: "🏗️ CI/CD"
    when:
      labels:
        - "CI/CD"
  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - "patch"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  default: patch
template: |
  ## Changes

  $CHANGES
