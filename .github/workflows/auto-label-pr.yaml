name: 🏷️ Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  labeler:
    name: 🏷️ Labeler
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      # Area labels from changed files and change-type labels from the PR title,
      # configured in the autolabeler section of .github/release-drafter.yml
      - name: Label PR
        uses: release-drafter/release-drafter/autolabeler@v7
